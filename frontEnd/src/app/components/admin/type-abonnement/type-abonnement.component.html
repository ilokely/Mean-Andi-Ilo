<app-menuAdmin></app-menuAdmin>
<main id="main" class="main">
    <section class="section">
        <!-- Header avec bouton d'ajout -->
        <div class="row mb-3">
            <div class="col-12 d-flex justify-content-between align-items-center">
                <h3>
                    <i class="bi bi-card-checklist me-2"></i>
                    Types d'abonnement
                </h3>         
            </div>
        </div>

        <div class="row">
            <div class="col-12">
                <div class="card">
                    <div class="card-body">
                        <h5 class="card-title">
                            Liste des types d'abonnement
                            <span class="badge bg-primary ms-2">{{ typesAbonnement.length }}</span>
                        </h5>
                        
                        <div class="table-responsive">
                            <table class="table table-hover table-striped">
                                <thead class="table-light">
                                    <tr>
                                        <th style="width: 60px;">#</th>
                                        <th>Type</th>
                                        <th style="width: 150px;">Réduction</th>
                                        <th style="width: 150px;">Actions</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <tr *ngFor="let type of typesAbonnement; let i = index">
                                        <td>{{ i + 1 }}</td>
                                        <td>
                                            <strong>{{ type.type }}</strong>
                                        </td>
                                        <td>
                                            <span class="badge" 
                                                  [class.bg-success]="type.reduction > 0"
                                                  [class.bg-secondary]="type.reduction === 0">
                                                <i class="bi" 
                                                   [class.bi-percent]="type.reduction > 0"
                                                   [class.bi-dash]="type.reduction === 0"></i>
                                                {{ type.reduction }}%
                                            </span>
                                        </td>
                                        <td>
                                            <button class="btn btn-sm btn-outline-primary me-2"
                                                    (click)="editType(type)"
                                                    title="Modifier">
                                                <i class="bi bi-pencil"></i>
                                            </button>
                                            <button class="btn btn-sm btn-outline-danger"
                                                    (click)="deleteType(type)"
                                                    title="Supprimer">
                                                <i class="bi bi-trash"></i>
                                            </button>
                                        </td>
                                    </tr>
                                    
                                    <!-- Message si vide -->
                                    <tr *ngIf="typesAbonnement.length === 0">
                                        <td colspan="4" class="text-center text-muted py-4">
                                            <i class="bi bi-inbox fs-1 d-block mb-2"></i>
                                            Aucun type d'abonnement trouvé
                                        </td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </section>
</main>
<app-footer></app-footer>
